<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏈 Gridiron Glory Slots - Provably Fair</title>
    <style>
        :root {
            --field-green: #1a5c2a;
            --field-green-light: #2d8a3e;
            --gold: #d4a843;
            --gold-light: #f0d478;
            --white: #f5f5f5;
            --dark: #1a1a1a;
            --panel-bg: #0d0d0d;
            --border: #333;
            --accent: #c41e3a;
            --accent-blue: #1e3a5f;
            --text: #e0e0e0;
            --text-bright: #ffffff;
            --win-glow: #ffd700;
            --button-50: #e63946;
            --button-100: #f4a261;
            --button-150: #2a9d8f;
            --button-200: #264653;
            --spin-btn: #c41e3a;
            --cashout-btn: #1e6091;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 40%, #0d1b0d 100%);
            font-family: 'Segoe UI', 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Main machine container */
        .slot-machine {
            background: linear-gradient(180deg, #1c1c1c 0%, #2a2a2a 30%, #1a1a1a 100%);
            border: 6px solid #444;
            border-radius: 24px;
            width: 100%;
            max-width: 820px;
            padding: 16px 20px 20px;
            box-shadow:
                0 0 0 3px #222,
                0 0 0 8px #1a1a1a,
                0 0 0 12px #333,
                0 20px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
        }

        /* Top marquee */
        .machine-header {
            background: linear-gradient(180deg, #c41e3a, #8b0000);
            border-radius: 14px 14px 6px 6px;
            padding: 10px 20px;
            text-align: center;
            margin-bottom: 12px;
            border: 2px solid #6b0000;
            box-shadow: 0 4px 15px rgba(200, 30, 50, 0.4);
            position: relative;
            overflow: hidden;
        }
        .machine-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            animation: headerShine 3s infinite;
        }
        @keyframes headerShine {
            0%,
            100% {
                left: -60%;
            }
            50% {
                left: 120%;
            }
        }
        .machine-title {
            font-size: 1.6em;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }
        .machine-subtitle {
            font-size: 0.7em;
            color: #ffcc00;
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
            font-weight: 600;
        }

        /* Main layout */
        .main-area {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        /* Reel grid container */
        .reels-container {
            flex: 1 1 480px;
            min-width: 360px;
            background: var(--field-green);
            border-radius: 16px;
            padding: 14px;
            border: 4px solid #3a7a3a;
            position: relative;
            box-shadow:
                inset 0 0 60px rgba(0, 0, 0, 0.4),
                0 8px 25px rgba(0, 0, 0, 0.5);
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(255, 255, 255, 0.04) 28px, rgba(255, 255, 255, 0.04) 30px);
        }
        /* Yard line markings */
        .reels-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            pointer-events: none;
            border-radius: 0;
            z-index: 0;
        }
        .yard-markers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .yard-marker {
            position: absolute;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.55em;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .reel-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
            position: relative;
            z-index: 1;
        }
        .reel-cell {
            aspect-ratio: 1;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            transition: all 0.12s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: default;
            position: relative;
            min-width: 48px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .reel-cell.spinning {
            animation: cellBounce 0.08s ease-in-out;
            border-color: rgba(255, 255, 255, 0.6);
        }
        @keyframes cellBounce {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(0.9);
            }
        }
        .reel-cell.win-highlight {
            border-color: #ffd700 !important;
            box-shadow:
                0 0 15px #ffd700,
                0 0 30px rgba(255, 215, 0, 0.7),
                0 0 50px rgba(255, 180, 0, 0.5) !important;
            animation: winPulse 0.5s ease-in-out infinite;
            z-index: 2;
            background: rgba(255, 215, 0, 0.25) !important;
        }
        @keyframes winPulse {
            0%,
            100% {
                box-shadow: 0 0 15px #ffd700, 0 0 30px rgba(255, 215, 0, 0.7);
            }
            50% {
                box-shadow: 0 0 30px #ffd700, 0 0 55px rgba(255, 215, 0, 0.9), 0 0 70px rgba(255, 180, 0, 0.6);
            }
        }
        .reel-cell.win-strong {
            border-color: #ff4500 !important;
            box-shadow: 0 0 20px #ff4500, 0 0 40px rgba(255, 69, 0, 0.8) !important;
            animation: winPulseStrong 0.4s ease-in-out infinite;
            background: rgba(255, 69, 0, 0.3) !important;
        }
        @keyframes winPulseStrong {
            0%,
            100% {
                box-shadow: 0 0 20px #ff4500, 0 0 40px rgba(255, 69, 0, 0.8);
            }
            50% {
                box-shadow: 0 0 40px #ff4500, 0 0 65px rgba(255, 69, 0, 1), 0 0 80px rgba(255, 100, 0, 0.7);
            }
        }

        /* Side panel */
        .side-panel {
            flex: 0 0 260px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 240px;
        }

        /* Info displays */
        .info-box {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.7em;
            color: #aaa;
            word-break: break-all;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        .info-box .label {
            color: #888;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
            font-weight: 700;
        }
        .info-box .value {
            color: #4ecb71;
            font-family: 'Courier New', 'Consolas', monospace;
            font-size: 0.85em;
            font-weight: 600;
        }
        .info-box .value.hash {
            color: #f0a050;
            font-size: 0.7em;
        }
        .info-box .value.nonce-val {
            color: #5bc0de;
            font-size: 1.1em;
            font-weight: 700;
        }
        .credits-display {
            background: linear-gradient(180deg, #0a0a0a, #111);
            border: 2px solid #444;
            border-radius: 12px;
            padding: 12px 16px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(0, 0, 0, 0.4);
        }
        .credits-label {
            font-size: 0.7em;
            color: #aaa;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .credits-amount {
            font-size: 2.4em;
            font-weight: 900;
            color: #4ecb71;
            text-shadow: 0 0 20px rgba(78, 203, 113, 0.6);
            font-family: 'Courier New', monospace;
        }
        .credits-amount.low {
            color: #f0a050;
            text-shadow: 0 0 20px rgba(240, 160, 80, 0.6);
        }
        .credits-amount.critical {
            color: #e63946;
            text-shadow: 0 0 20px rgba(230, 57, 70, 0.6);
            animation: blinkCredits 0.8s infinite;
        }
        @keyframes blinkCredits {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85em;
            letter-spacing: 1px;
            transition: all 0.15s;
            text-transform: uppercase;
            flex: 1;
            min-width: 55px;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }
        .btn:active {
            transform: scale(0.94);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
            filter: grayscale(40%);
        }
        .btn-bet {
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .btn-bet-50 {
            background: #7b2d3b;
        }
        .btn-bet-100 {
            background: #8b5a2b;
        }
        .btn-bet-150 {
            background: #1a6b5a;
        }
        .btn-bet-200 {
            background: #1e3d5c;
        }
        .btn-bet.active-bet {
            border-color: #ffd700 !important;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.5);
            transform: scale(1.04);
            z-index: 3;
            animation: activeBetGlow 1s ease-in-out infinite;
        }
        @keyframes activeBetGlow {
            0%,
            100% {
                box-shadow: 0 0 18px rgba(255, 215, 0, 0.5);
            }
            50% {
                box-shadow: 0 0 28px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 180, 0, 0.4);
            }
        }
        .btn-spin {
            background: linear-gradient(180deg, #e63946, #b71c2a);
            color: #fff;
            font-size: 1em;
            padding: 13px 20px;
            flex: 2;
            letter-spacing: 2px;
            border: 2px solid #ff6b6b;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.5);
        }
        .btn-spin:hover:not(:disabled) {
            box-shadow: 0 6px 22px rgba(255, 80, 80, 0.7);
        }
        .btn-autospin {
            background: linear-gradient(180deg, #5c3d6e, #3d1f4e);
            color: #fff;
            border: 2px solid #9b6db5;
            box-shadow: 0 4px 12px rgba(120, 60, 160, 0.4);
        }
        .btn-autospin.active-autospin {
            animation: autoSpinPulse 0.6s ease-in-out infinite;
            border-color: #ff0 !important;
            box-shadow: 0 0 22px rgba(255, 255, 0, 0.6) !important;
            background: linear-gradient(180deg, #8b3a3a, #5c1a1a) !important;
        }
        @keyframes autoSpinPulse {
            0%,
            100% {
                box-shadow: 0 0 22px rgba(255, 255, 0, 0.6);
            }
            50% {
                box-shadow: 0 0 35px rgba(255, 255, 0, 0.9), 0 0 50px rgba(255, 200, 0, 0.5);
            }
        }
        .btn-cashout {
            background: linear-gradient(180deg, #1e6091, #0d3b5c);
            color: #fff;
            border: 2px solid #4da6d9;
            box-shadow: 0 4px 15px rgba(30, 96, 145, 0.5);
            font-size: 0.9em;
            letter-spacing: 2px;
        }
        .btn-cashout:hover:not(:disabled) {
            box-shadow: 0 6px 22px rgba(50, 140, 200, 0.7);
        }
        .btn-cash {
            background: #2a5a2a;
            color: #fff;
            border: 1px solid #4a8a4a;
            font-size: 0.7em;
            padding: 7px 8px;
            flex: 1;
            min-width: 40px;
            letter-spacing: 0;
        }
        .btn-cash:hover:not(:disabled) {
            background: #3a7a3a;
        }

        /* Win banner */
        .win-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffd700;
            border-radius: 16px;
            padding: 16px 28px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.7);
        }
        .win-banner.show {
            transform: translate(-50%, -50%) scale(1);
        }
        .win-banner .win-amount {
            font-size: 2.5em;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 25px #ffd700;
            letter-spacing: 2px;
        }
        .win-banner .win-label {
            color: #fff;
            font-size: 0.8em;
            letter-spacing: 3px;
        }

        /* Receipt overlay */
        .receipt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .receipt-overlay.show {
            opacity: 1;
            pointer-events: all;
        }
        .receipt-paper {
            background: #fffef5;
            color: #1a1a1a;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.75em;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            position: relative;
        }
        .receipt-paper h3 {
            text-align: center;
            font-size: 1.3em;
            margin-bottom: 12px;
            border-bottom: 2px dashed #ccc;
            padding-bottom: 10px;
            letter-spacing: 2px;
        }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px dotted #ddd;
        }
        .receipt-row .rlbl {
            font-weight: 700;
            color: #555;
            font-size: 0.85em;
        }
        .receipt-row .rval {
            color: #1a1a1a;
            word-break: break-all;
            text-align: right;
            max-width: 60%;
            font-size: 0.8em;
        }
        .qr-placeholder {
            text-align: center;
            margin: 16px 0;
            padding: 16px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .qr-placeholder canvas {
            display: block;
            margin: 0 auto;
        }
        .btn-close-receipt {
            display: block;
            margin: 16px auto 0;
            padding: 10px 30px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 0.9em;
        }
        .btn-close-receipt:hover {
            background: #333;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            z-index: 200;
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 0.85em;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            border: 1px solid #444;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.warn {
            border-color: #f0a050;
            color: #f0a050;
        }
        .toast.success {
            border-color: #4ecb71;
            color: #4ecb71;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .main-area {
                flex-direction: column;
                align-items: center;
            }
            .side-panel {
                flex: 0 0 auto;
                width: 100%;
                max-width: 480px;
            }
            .reels-container {
                min-width: 300px;
            }
            .reel-cell {
                font-size: 1.4em;
                min-width: 36px;
                border-radius: 6px;
            }
            .machine-title {
                font-size: 1.2em;
            }
            .credits-amount {
                font-size: 1.8em;
            }
            .btn {
                font-size: 0.7em;
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="slot-machine" id="slotMachine">
        <!-- Header -->
        <div class="machine-header">
            <div class="machine-title">🏈 GRIDIRON GLORY</div>
            <div class="machine-subtitle">PROVABLY FAIR SLOTS</div>
        </div>

        <!-- Main area -->
        <div class="main-area">
            <!-- Reels -->
            <div class="reels-container" id="reelsContainer">
                <div class="yard-markers" id="yardMarkers"></div>
                <div class="reel-grid" id="reelGrid"></div>
                <div class="win-banner" id="winBanner">
                    <div class="win-label">🏆 WINNER 🏆</div>
                    <div class="win-amount" id="winAmountDisplay">0</div>
                    <div class="win-label">CREDITS</div>
                </div>
            </div>

            <!-- Side panel -->
            <div class="side-panel">
                <!-- Credits -->
                <div class="credits-display">
                    <div class="credits-label">💰 CREDITS</div>
                    <div class="credits-amount" id="creditsDisplay">10,000</div>
                    <div style="font-size:0.6em;color:#888;">$1 = 100 credits</div>
                </div>

                <!-- Bet buttons -->
                <div class="btn-row">
                    <button class="btn btn-bet btn-bet-50 active-bet" data-bet="50" id="btnBet50">50</button>
                    <button class="btn btn-bet btn-bet-100" data-bet="100" id="btnBet100">100</button>
                    <button class="btn btn-bet btn-bet-150" data-bet="150" id="btnBet150">150</button>
                    <button class="btn btn-bet btn-bet-200" data-bet="200" id="btnBet200">200</button>
                </div>

                <!-- Action buttons -->
                <div class="btn-row">
                    <button class="btn btn-spin" id="btnSpin">🎰 SPIN</button>
                </div>
                <div class="btn-row">
                    <button class="btn btn-autospin" id="btnAutoSpin">🔄 AUTO SPIN</button>
                    <button class="btn btn-cashout" id="btnCashOut">💵 CASH OUT</button>
                </div>

                <!-- Cash insertion -->
                <div style="font-size:0.65em;color:#888;text-align:center;letter-spacing:1px;margin-top:2px;">
                    INSERT CASH
                </div>
                <div class="btn-row">
                    <button class="btn btn-cash" data-cash="1">$1</button>
                    <button class="btn btn-cash" data-cash="5">$5</button>
                    <button class="btn btn-cash" data-cash="10">$10</button>
                    <button class="btn btn-cash" data-cash="20">$20</button>
                    <button class="btn btn-cash" data-cash="50">$50</button>
                    <button class="btn btn-cash" data-cash="100">$100</button>
                </div>

                <!-- Seed info -->
                <div class="info-box">
                    <div class="label">🔒 Server Seed Hash (SHA256)</div>
                    <div class="value hash" id="serverSeedHash">—</div>
                </div>
                <div class="info-box">
                    <div class="label">🎲 Client Seed</div>
                    <div class="value" id="clientSeed">—</div>
                </div>
                <div class="info-box">
                    <div class="label">🔢 Nonce</div>
                    <div class="value nonce-val" id="nonceDisplay">1</div>
                </div>
                <div class="info-box" style="font-size:0.6em;color:#666;text-align:center;">
                    Session: <span id="sessionIdDisplay" style="color:#888;">—</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Receipt overlay -->
    <div class="receipt-overlay" id="receiptOverlay">
        <div class="receipt-paper" id="receiptPaper"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ==================== CONSTANTS ====================
            const SYMBOLS = [
                { id: 'football', emoji: '🏈', name: 'Football', weight: 8 },
                { id: 'helmet', emoji: '🪖', name: 'Helmet', weight: 16 },
                { id: 'trophy', emoji: '🏆', name: 'Trophy', weight: 30 },
                { id: 'jersey', emoji: '👕', name: 'Jersey', weight: 50 },
                { id: 'fieldgoal', emoji: '🥅', name: 'Field Goal', weight: 75 },
                { id: 'stadium', emoji: '🏟️', name: 'Stadium', weight: 100 },
                { id: 'cleats', emoji: '👟', name: 'Cleats', weight: 130 },
                { id: 'whistle', emoji: '📣', name: 'Whistle', weight: 155 },
                { id: 'downmarker', emoji: '📏', name: 'Down Marker', weight: 195 },
            ];
            const TOTAL_WEIGHT = SYMBOLS.reduce((sum, s) => sum + s.weight, 0);

            // Paytable: [symbolId, 3-in-row, 4-in-row, 5-in-row] as multiplier of bet
            const PAYTABLE = {
                'football': [50, 200, 500],
                'helmet': [20, 80, 250],
                'trophy': [10, 40, 120],
                'jersey': [5, 20, 60],
                'fieldgoal': [2.5, 10, 30],
                'stadium': [1.5, 6, 18],
                'cleats': [0.8, 3, 10],
                'whistle': [0.3, 1.5, 6],
                'downmarker': [0.1, 0.5, 2.5],
            };

            // 10 paylines (left to right), each is array of [row, col] for 5 positions
            const PAYLINES = [
                // 0: Top row
                [
                    [0, 0],
                    [0, 1],
                    [0, 2],
                    [0, 3],
                    [0, 4]
                ],
                // 1: Second row
                [
                    [1, 0],
                    [1, 1],
                    [1, 2],
                    [1, 3],
                    [1, 4]
                ],
                // 2: Middle row
                [
                    [2, 0],
                    [2, 1],
                    [2, 2],
                    [2, 3],
                    [2, 4]
                ],
                // 3: Fourth row
                [
                    [3, 0],
                    [3, 1],
                    [3, 2],
                    [3, 3],
                    [3, 4]
                ],
                // 4: Bottom row
                [
                    [4, 0],
                    [4, 1],
                    [4, 2],
                    [4, 3],
                    [4, 4]
                ],
                // 5: V-shape
                [
                    [0, 0],
                    [1, 1],
                    [2, 2],
                    [3, 3],
                    [4, 4]
                ],
                // 6: Inverted V
                [
                    [4, 0],
                    [3, 1],
                    [2, 2],
                    [1, 3],
                    [0, 4]
                ],
                // 7: W-shape
                [
                    [0, 0],
                    [2, 1],
                    [1, 2],
                    [2, 3],
                    [0, 4]
                ],
                // 8: M-shape
                [
                    [4, 0],
                    [2, 1],
                    [3, 2],
                    [2, 3],
                    [4, 4]
                ],
                // 9: Zigzag
                [
                    [1, 0],
                    [3, 1],
                    [2, 2],
                    [3, 3],
                    [1, 4]
                ],
            ];

            // ==================== STATE ====================
            let credits = 10000;
            let betSize = 50;
            let serverSeed = null;
            let serverSeedHash = null;
            let clientSeed = null;
            let nonce = 1;
            let sessionId = null;
            let sessionStartTime = null;
            let nonceRangeStart = 1;
            let isSpinning = false;
            let autoSpinActive = false;
            let autoSpinTimer = null;
            let currentGrid = null; // 5x5 array of symbol objects
            let sessionNoncesUsed = [];

            // ==================== DOM REFS ====================
            const reelGrid = document.getElementById('reelGrid');
            const creditsDisplay = document.getElementById('creditsDisplay');
            const winBanner = document.getElementById('winBanner');
            const winAmountDisplay = document.getElementById('winAmountDisplay');
            const serverSeedHashEl = document.getElementById('serverSeedHash');
            const clientSeedEl = document.getElementById('clientSeed');
            const nonceDisplay = document.getElementById('nonceDisplay');
            const sessionIdDisplay = document.getElementById('sessionIdDisplay');
            const receiptOverlay = document.getElementById('receiptOverlay');
            const receiptPaper = document.getElementById('receiptPaper');
            const toast = document.getElementById('toast');
            const btnSpin = document.getElementById('btnSpin');
            const btnAutoSpin = document.getElementById('btnAutoSpin');
            const btnCashOut = document.getElementById('btnCashOut');
            const reelsContainer = document.getElementById('reelsContainer');
            const yardMarkers = document.getElementById('yardMarkers');

            // ==================== CRYPTO HELPERS ====================
            function generateHex64() {
                const arr = new Uint8Array(32);
                crypto.getRandomValues(arr);
                return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
            }

            function generateClientSeed(length = 16) {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                const arr = new Uint8Array(length);
                crypto.getRandomValues(arr);
                return Array.from(arr).map(b => chars[b % chars.length]).join('');
            }

            async function sha256(message) {
                const encoder = new TextEncoder();
                const data = encoder.encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            async function hmacSha256(key, message) {
                const encoder = new TextEncoder();
                const keyData = encoder.encode(key);
                const msgData = encoder.encode(message);
                const cryptoKey = await crypto.subtle.importKey(
                    'raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
                );
                const signature = await crypto.subtle.sign('HMAC', cryptoKey, msgData);
                const hashArray = Array.from(new Uint8Array(signature));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            // ==================== SYMBOL MAPPING ====================
            function hexToSymbol(hexPair) {
                const val = parseInt(hexPair, 16); // 0-255
                const scaled = Math.floor((val / 255) * TOTAL_WEIGHT);
                let cumulative = 0;
                for (const sym of SYMBOLS) {
                    cumulative += sym.weight;
                    if (scaled < cumulative) return sym;
                }
                return SYMBOLS[SYMBOLS.length - 1];
            }

            // ==================== PROVABLY FAIR SPIN ====================
            async function computeSpinResult(servSeed, cliSeed, n) {
                const message = cliSeed + ':' + n;
                const hmacHex = await hmacSha256(servSeed, message);
                // hmacHex is 64 hex chars. Use pairs for 25 positions = 50 hex chars needed.
                const grid = [];
                for (let row = 0; row < 5; row++) {
                    const rowSymbols = [];
                    for (let col = 0; col < 5; col++) {
                        const idx = (row * 5 + col) * 2;
                        const hexPair = hmacHex.substring(idx, idx + 2);
                        rowSymbols.push(hexToSymbol(hexPair));
                    }
                    grid.push(rowSymbols);
                }
                return grid;
            }

            // ==================== WIN EVALUATION ====================
            function evaluateWins(grid, betAmount) {
                const wins = []; // { paylineIndex, symbol, count, multiplier, winCredits, positions }
                for (let plIdx = 0; plIdx < PAYLINES.length; plIdx++) {
                    const pl = PAYLINES[plIdx];
                    // Check consecutive from left
                    const firstSym = grid[pl[0][0]][pl[0][1]];
                    let count = 1;
                    const positions = [
                        [pl[0][0], pl[0][1]]
                    ];
                    for (let i = 1; i < pl.length; i++) {
                        const sym = grid[pl[i][0]][pl[i][1]];
                        if (sym.id === firstSym.id) {
                            count++;
                            positions.push([pl[i][0], pl[i][1]]);
                        } else {
                            break;
                        }
                    }
                    if (count >= 3) {
                        const paytableEntry = PAYTABLE[firstSym.id];
                        let multiplier = 0;
                        if (count === 3) multiplier = paytableEntry[0];
                        else if (count === 4) multiplier = paytableEntry[1];
                        else if (count === 5) multiplier = paytableEntry[2];
                        const winCredits = Math.floor(betAmount * multiplier);
                        if (winCredits > 0) {
                            wins.push({
                                paylineIndex: plIdx,
                                symbol: firstSym,
                                count,
                                multiplier,
                                winCredits,
                                positions,
                            });
                        }
                    }
                }
                // Sort by winCredits descending
                wins.sort((a, b) => b.winCredits - a.winCredits);
                return wins;
            }

            // ==================== RENDER GRID ====================
            function renderGrid(grid, winningPositions = new Set()) {
                reelGrid.innerHTML = '';
                for (let row = 0; row < 5; row++) {
                    for (let col = 0; col < 5; col++) {
                        const cell = document.createElement('div');
                        cell.className = 'reel-cell';
                        cell.textContent = grid[row][col].emoji;
                        cell.title = grid[row][col].name;
                        const posKey = `${row},${col}`;
                        if (winningPositions.has(posKey)) {
                            // Check if it's a big win (5 in row)
                            const isStrong = [...winningPositions].some(p => {
                                const [r, c] = p.split(',').map(Number);
                                // If any win on this row has 5 count, mark strong
                                return r === row && winningPositions.size >= 5;
                            });
                            cell.classList.add('win-highlight');
                            if (isStrong && winningPositions.size >= 5) {
                                cell.classList.add('win-strong');
                            }
                        }
                        reelGrid.appendChild(cell);
                    }
                }
            }

            function getWinningPositionSet(wins) {
                const posSet = new Set();
                for (const win of wins) {
                    for (const [r, c] of win.positions) {
                        posSet.add(`${r},${c}`);
                    }
                }
                return posSet;
            }

            // ==================== UPDATE UI ====================
            function updateCreditsDisplay() {
                creditsDisplay.textContent = credits.toLocaleString();
                creditsDisplay.classList.remove('low', 'critical');
                if (credits < betSize && credits > 0) {
                    creditsDisplay.classList.add('critical');
                } else if (credits < betSize * 4 && credits > 0) {
                    creditsDisplay.classList.add('low');
                }
            }

            function updateSeedDisplay() {
                serverSeedHashEl.textContent = serverSeedHash || '—';
                clientSeedEl.textContent = clientSeed || '—';
                nonceDisplay.textContent = nonce;
                sessionIdDisplay.textContent = sessionId ? sessionId.substring(0, 12) + '...' : '—';
            }

            function setActiveBetButton(bet) {
                document.querySelectorAll('.btn-bet').forEach(b => b.classList.remove('active-bet'));
                const btn = document.querySelector(`.btn-bet[data-bet="${bet}"]`);
                if (btn) btn.classList.add('active-bet');
            }

            // ==================== TOAST ====================
            let toastTimeout;

            function showToast(message, type = '') {
                clearTimeout(toastTimeout);
                toast.textContent = message;
                toast.className = 'toast ' + type + ' show';
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            }

            // ==================== WIN BANNER ====================
            let winBannerTimeout;

            function showWinBanner(totalWin) {
                clearTimeout(winBannerTimeout);
                winAmountDisplay.textContent = totalWin.toLocaleString();
                winBanner.classList.add('show');
                winBannerTimeout = setTimeout(() => {
                    winBanner.classList.remove('show');
                }, 2000);
            }

            // ==================== SPIN ANIMATION ====================
            function animateSpin(durationMs = 900) {
                return new Promise((resolve) => {
                    const cells = reelGrid.querySelectorAll('.reel-cell');
                    const totalFlashes = Math.floor(durationMs / 70);
                    let flashCount = 0;
                    const interval = setInterval(() => {
                        flashCount++;
                        // Randomly update cells during spin
                        cells.forEach(cell => {
                            const randomSym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                            cell.textContent = randomSym.emoji;
                            cell.classList.add('spinning');
                            setTimeout(() => cell.classList.remove('spinning'), 60);
                        });
                        if (flashCount >= totalFlashes) {
                            clearInterval(interval);
                            resolve();
                        }
                    }, 70);
                });
            }

            // ==================== PERFORM SPIN ====================
            async function performSpin() {
                if (isSpinning) return;
                if (credits < betSize) {
                    showToast('Insufficient credits! Insert cash.', 'warn');
                    stopAutoSpin();
                    return;
                }
                if (!serverSeed || !clientSeed) {
                    showToast('Session not initialized. Please cash out first.', 'warn');
                    return;
                }

                isSpinning = true;
                btnSpin.disabled = true;
                btnCashOut.disabled = true;
                document.querySelectorAll('.btn-bet').forEach(b => b.disabled = true);
                document.querySelectorAll('.btn-cash').forEach(b => b.disabled = true);

                // Deduct bet
                credits -= betSize;
                updateCreditsDisplay();

                // Clear previous win highlights
                reelGrid.querySelectorAll('.reel-cell').forEach(c => {
                    c.classList.remove('win-highlight', 'win-strong');
                });
                winBanner.classList.remove('show');

                // Compute result
                const grid = await computeSpinResult(serverSeed, clientSeed, nonce);
                currentGrid = grid;
                sessionNoncesUsed.push(nonce);
                nonce++;
                updateSeedDisplay();

                // Animate
                await animateSpin(700);

                // Render final grid
                const wins = evaluateWins(grid, betSize);
                const winPosSet = getWinningPositionSet(wins);
                renderGrid(grid, winPosSet);

                // Calculate total win
                let totalWin = 0;
                for (const w of wins) {
                    totalWin += w.winCredits;
                }

                if (totalWin > 0) {
                    credits += totalWin;
                    showWinBanner(totalWin);
                    if (totalWin >= betSize * 100) {
                        showToast('🔥 MASSIVE WIN! ' + totalWin.toLocaleString() + ' credits!', 'success');
                    }
                }

                updateCreditsDisplay();
                isSpinning = false;
                btnSpin.disabled = false;
                btnCashOut.disabled = false;
                document.querySelectorAll('.btn-bet').forEach(b => b.disabled = false);
                document.querySelectorAll('.btn-cash').forEach(b => b.disabled = false);

                // Check if out of credits
                if (credits < betSize && autoSpinActive) {
                    stopAutoSpin();
                    showToast('Out of credits. Auto-spin stopped.', 'warn');
                }
                if (credits <= 0 && !autoSpinActive) {
                    showToast('Credits depleted. Insert cash to continue.', 'warn');
                }
            }

            // ==================== AUTO SPIN ====================
            function startAutoSpin() {
                if (autoSpinActive) return;
                if (credits < betSize) {
                    showToast('Insufficient credits for auto-spin.', 'warn');
                    return;
                }
                autoSpinActive = true;
                btnAutoSpin.textContent = '⏹ STOP AUTO';
                btnAutoSpin.classList.add('active-autospin');
                autoSpinLoop();
            }

            function stopAutoSpin() {
                autoSpinActive = false;
                btnAutoSpin.textContent = '🔄 AUTO SPIN';
                btnAutoSpin.classList.remove('active-autospin');
                if (autoSpinTimer) clearTimeout(autoSpinTimer);
                autoSpinTimer = null;
            }

            function autoSpinLoop() {
                if (!autoSpinActive) return;
                if (credits < betSize) {
                    stopAutoSpin();
                    showToast('Out of credits. Auto-spin stopped.', 'warn');
                    return;
                }
                autoSpinTimer = setTimeout(async () => {
                    await performSpin();
                    if (autoSpinActive) autoSpinLoop();
                }, 400);
            }

            function toggleAutoSpin() {
                if (autoSpinActive) {
                    stopAutoSpin();
                } else {
                    startAutoSpin();
                }
            }

            // ==================== SESSION MANAGEMENT ====================
            async function initSession() {
                serverSeed = generateHex64();
                serverSeedHash = await sha256(serverSeed);
                clientSeed = generateClientSeed(16);
                nonce = 1;
                sessionNoncesUsed = [];
                nonceRangeStart = 1;
                sessionId = 'SESS-' + generateHex64().substring(0, 16).toUpperCase();
                sessionStartTime = new Date();
                currentGrid = null;
                updateSeedDisplay();
                // Render empty/initial grid
                const initialGrid = [];
                for (let r = 0; r < 5; r++) {
                    const row = [];
                    for (let c = 0; c < 5; c++) {
                        row.push(SYMBOLS[SYMBOLS.length - 1]); // default symbol
                    }
                    initialGrid.push(row);
                }
                renderGrid(initialGrid, new Set());
                updateCreditsDisplay();
                console.log('🆕 New session:', sessionId);
                console.log('🔒 Server seed (KEEP SECRET until cash out):', serverSeed);
                console.log('🔑 Server seed hash (public):', serverSeedHash);
                console.log('🎲 Client seed:', clientSeed);
            }

            async function cashOut() {
                if (isSpinning) {
                    showToast('Wait for spin to complete.', 'warn');
                    return;
                }
                if (autoSpinActive) stopAutoSpin();

                const sessionEndTime = new Date();
                const nonceRangeEnd = nonce - 1;
                const creditsToCash = credits;
                const totalWagered = sessionNoncesUsed.length * betSize; // approximate

                // Build receipt data
                const receiptData = {
                    sessionId,
                    sessionStart: sessionStartTime.toISOString(),
                    sessionEnd: sessionEndTime.toISOString(),
                    serverSeed: serverSeed,
                    serverSeedHash: serverSeedHash,
                    clientSeed: clientSeed,
                    nonceRange: `${nonceRangeStart} – ${nonceRangeEnd}`,
                    noncesUsed: sessionNoncesUsed.length,
                    creditsCashedOut: creditsToCash,
                    totalWageredApprox: totalWagered,
                    verificationUrl: `https://verify.gridironglory.com/verify?session=${sessionId}&hash=${serverSeedHash}`,
                };

                // Show receipt
                showReceipt(receiptData);

                // Reset machine
                credits = 0;
                updateCreditsDisplay();

                // Start new session
                await initSession();
                showToast('New session started. Insert cash to play.', 'success');
            }

            function showReceipt(data) {
                const qrData = data.verificationUrl;
                receiptPaper.innerHTML = `
                    <h3>🧾 CASH OUT RECEIPT</h3>
                    <div class="receipt-row"><span class="rlbl">Session ID:</span><span class="rval">${data.sessionId}</span></div>
                    <div class="receipt-row"><span class="rlbl">Start:</span><span class="rval">${data.sessionStart}</span></div>
                    <div class="receipt-row"><span class="rlbl">End:</span><span class="rval">${data.sessionEnd}</span></div>
                    <div class="receipt-row"><span class="rlbl">Server Seed:</span><span class="rval" style="font-size:0.65em;">${data.serverSeed}</span></div>
                    <div class="receipt-row"><span class="rlbl">Server Seed Hash:</span><span class="rval" style="font-size:0.65em;">${data.serverSeedHash}</span></div>
                    <div class="receipt-row"><span class="rlbl">Client Seed:</span><span class="rval">${data.clientSeed}</span></div>
                    <div class="receipt-row"><span class="rlbl">Nonce Range:</span><span class="rval">${data.nonceRange}</span></div>
                    <div class="receipt-row"><span class="rlbl">Spins Played:</span><span class="rval">${data.noncesUsed}</span></div>
                    <div class="receipt-row"><span class="rlbl">Credits Cashed:</span><span class="rval" style="font-weight:900;font-size:1.1em;">${data.creditsCashedOut.toLocaleString()}</span></div>
                    <div class="qr-placeholder">
                        <strong>📱 Verify Your Spins</strong>
                        <p style="font-size:0.7em;word-break:break-all;color:#555;">${data.verificationUrl}</p>
                        <canvas id="qrCanvas" width="180" height="180"></canvas>
                        <p style="font-size:0.6em;color:#888;">Scan QR code to verify all outcomes</p>
                    </div>
                    <button class="btn-close-receipt" id="btnCloseReceipt">CLOSE & CONTINUE</button>
                `;
                receiptOverlay.classList.add('show');

                // Generate simple QR-like pattern (since we can't use external libs, draw a visual representation)
                setTimeout(() => {
                    const canvas = document.getElementById('qrCanvas');
                    if (canvas) drawSimpleQR(canvas, qrData);
                }, 100);

                document.getElementById('btnCloseReceipt').addEventListener('click', () => {
                    receiptOverlay.classList.remove('show');
                });
            }

            function drawSimpleQR(canvas, data) {
                const ctx = canvas.getContext('2d');
                const size = canvas.width;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, size, size);

                // Generate a deterministic pattern from the data
                const moduleCount = 21;
                const moduleSize = size / moduleCount;

                // Simple hash to create QR-like pattern
                let hashVal = 0;
                for (let i = 0; i < data.length; i++) {
                    hashVal = ((hashVal << 5) - hashVal + data.charCodeAt(i)) | 0;
                }

                ctx.fillStyle = '#000000';
                // Draw finder patterns (3 corners)
                const drawFinder = (x, y) => {
                    ctx.fillRect(x * moduleSize, y * moduleSize, 7 * moduleSize, 7 * moduleSize);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect((x + 1) * moduleSize, (y + 1) * moduleSize, 5 * moduleSize, 5 * moduleSize);
                    ctx.fillStyle = '#000000';
                    ctx.fillRect((x + 2) * moduleSize, (y + 2) * moduleSize, 3 * moduleSize, 3 * moduleSize);
                };
                drawFinder(0, 0);
                drawFinder(14, 0);
                drawFinder(0, 14);

                // Fill remaining modules with deterministic pattern
                let seed = Math.abs(hashVal);
                for (let row = 0; row < moduleCount; row++) {
                    for (let col = 0; col < moduleCount; col++) {
                        // Skip finder areas
                        if ((row < 7 && col < 7) || (row < 7 && col > 13) || (row > 13 && col < 7)) continue;
                        seed = (seed * 1103515245 + 12345) & 0x7fffffff;
                        if (seed % 3 === 0) {
                            ctx.fillStyle = '#000000';
                            ctx.fillRect(col * moduleSize, row * moduleSize, moduleSize, moduleSize);
                        }
                    }
                }
                // Border
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, size, size);
            }

            // ==================== CASH INSERTION ====================
            function insertCash(dollarAmount) {
                if (isSpinning) {
                    showToast('Wait for spin to complete.', 'warn');
                    return;
                }
                const creditsToAdd = dollarAmount * 100;
                credits += creditsToAdd;
                updateCreditsDisplay();
                showToast(`💵 $${dollarAmount} inserted → +${creditsToAdd} credits`, 'success');
                // Re-enable spin if credits now sufficient
                if (credits >= betSize) {
                    btnSpin.disabled = false;
                }
            }

            // ==================== EVENT LISTENERS ====================
            btnSpin.addEventListener('click', () => {
                if (!autoSpinActive) performSpin();
            });

            btnAutoSpin.addEventListener('click', toggleAutoSpin);

            btnCashOut.addEventListener('click', cashOut);

            document.querySelectorAll('.btn-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (isSpinning || autoSpinActive) return;
                    betSize = parseInt(btn.dataset.bet);
                    setActiveBetButton(betSize);
                    if (credits < betSize) {
                        showToast('Bet exceeds credits. Insert cash.', 'warn');
                    }
                });
            });

            document.querySelectorAll('.btn-cash').forEach(btn => {
                btn.addEventListener('click', () => {
                    insertCash(parseInt(btn.dataset.cash));
                });
            });

            // Close receipt by clicking overlay background
            receiptOverlay.addEventListener('click', function(e) {
                if (e.target === receiptOverlay) {
                    receiptOverlay.classList.remove('show');
                }
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.code === 'Space') {
                    e.preventDefault();
                    if (!autoSpinActive && !isSpinning && credits >= betSize) performSpin();
                } else if (e.key === 'a' || e.key === 'A') {
                    e.preventDefault();
                    toggleAutoSpin();
                } else if (e.key === 'c' || e.key === 'C') {
                    e.preventDefault();
                    if (!isSpinning && !autoSpinActive) cashOut();
                }
            });

            // ==================== YARD MARKERS ====================
            function setupYardMarkers() {
                const labels = ['G', '10', '20', '30', '40', '50', '40', '30', '20', '10', 'G'];
                yardMarkers.innerHTML = '';
                for (let i = 0; i < 5; i++) {
                    const marker = document.createElement('span');
                    marker.className = 'yard-marker';
                    marker.textContent = labels[i];
                    marker.style.top = (i * 20 + 8) + '%';
                    marker.style.left = '2px';
                    yardMarkers.appendChild(marker);
                    const markerR = document.createElement('span');
                    markerR.className = 'yard-marker';
                    markerR.textContent = labels[i + 6];
                    markerR.style.top = (i * 20 + 8) + '%';
                    markerR.style.right = '2px';
                    yardMarkers.appendChild(markerR);
                }
            }

            // ==================== INIT ====================
            async function init() {
                setupYardMarkers();
                await initSession();
                setActiveBetButton(betSize);
                updateCreditsDisplay();
                updateSeedDisplay();
                console.log('🏈 Gridiron Glory Slots initialized!');
                console.log('💰 Starting credits:', credits.toLocaleString());
                console.log('🎰 Bet size:', betSize, 'credits');
                console.log('📋 Provably Fair — Verify all spins at cash out.');
            }

            init();

            // Expose for debugging
            window.slotDebug = {
                getState: () => ({
                    credits,
                    betSize,
                    serverSeed,
                    serverSeedHash,
                    clientSeed,
                    nonce,
                    sessionId,
                    sessionNoncesUsed,
                    isSpinning,
                    autoSpinActive,
                    currentGrid,
                }),
                getServerSeed: () => serverSeed,
                getSessionInfo: () => ({
                    sessionId,
                    serverSeedHash,
                    clientSeed,
                    nonceRangeStart,
                    nonceCurrent: nonce,
                }),
            };
        })();
    </script>
